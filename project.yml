name: OwnAudioPodcasts
options:
  bundleIdPrefix: audio.own
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  PlayerEngine:
    path: Packages/PlayerEngine
targets:
  OwnAudioPodcasts:
    type: application
    platform: iOS
    sources:
      - path: App/OwnAudioPodcasts
    info:
      path: App/OwnAudioPodcasts/Info.plist
      properties:
        CFBundleDisplayName: own.podcast
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        # Only standard HTTPS, which is exempt; saves answering the export question per build.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Feeds and home servers can be plain http, and the addresses are whatever the
        # listener adds, so ATS can't be scoped to known domains.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connects to the podcast server on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: audio.own.podcastplayer
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # No DEVELOPMENT_TEAM here: this repo is public. Simulator builds don't need one; for a
        # device, pick your team in Xcode (it is not saved into project.yml).
    dependencies:
      - package: PlayerEngine
        product: PlayerCore
      - package: PlayerEngine
        product: SpokenEngine
  OwnAudioPodcastsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OwnAudioPodcasts
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: OwnAudioPodcasts
schemes:
  OwnAudioPodcasts:
    build:
      targets:
        OwnAudioPodcasts: all
        OwnAudioPodcastsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OwnAudioPodcastsUITests
    archive:
      config: Release
